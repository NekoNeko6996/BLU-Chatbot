<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử cập nhật Vector - BLU Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --gcp-bg: #0d1117; /* Nền GitHub Dark */
            --gcp-surface: #161b22; /* Nền các thẻ Card/Aside */
            --gcp-border: #30363d; /* Viền xám */
            --gcp-primary: #58a6ff; /* Xanh dương GitHub */
            --gcp-text: #e6edf3; /* Trắng sáng rõ ràng */
            
            /* ĐÃ FIX MÀU TEXT-MUTED CHO SÁNG VÀ DỄ ĐỌC HƠN */
            --gcp-text-muted: #8b949e; 
        }
        body { background-color: var(--gcp-bg); color: var(--gcp-text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; height: 100vh; overflow: hidden; }
        
        /* Ghi đè class Bootstrap mặc định đang bị tối */
        .text-muted { color: var(--gcp-text-muted) !important; font-weight: 400; }
        .text-secondary { color: #8b949e !important; }
        .text-light { color: #e6edf3 !important; }

        /* Bố cục 2 cột chia đôi màn hình */
        .layout-container { display: flex; height: calc(100vh - 60px); }
        .sidebar { width: 350px; min-width: 350px; border-right: 1px solid var(--gcp-border); background-color: var(--gcp-bg); overflow-y: auto; }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 24px; background-color: var(--gcp-bg); }

        /* Tùy chỉnh thanh cuộn Sidebar & Main */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #484f58; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6e7681; }

        /* Item Lịch sử bên trái */
        .history-item {
            padding: 16px; border-bottom: 1px solid var(--gcp-border);
            cursor: pointer; transition: background-color 0.15s;
        }
        .history-item:hover { background-color: #1c2128; }
        .history-item.active {
            background-color: var(--gcp-surface);
            border-left: 4px solid var(--gcp-primary);
        }
        .history-item .file-name { font-size: 14px; font-weight: 600; color: var(--gcp-text); margin-bottom: 6px; word-break: break-all; }
        .history-item .meta-info { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        
        /* Badges */
        .gh-badge { border: 1px solid var(--gcp-border); border-radius: 2em; padding: 2px 8px; font-size: 11px; color: var(--gcp-text-muted); font-family: monospace; }
        .badge-add { background-color: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid rgba(46,160,67,0.4); padding: 2px 6px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-del { background-color: rgba(248, 81, 73, 0.15); color: #ff7b72; border: 1px solid rgba(248,81,73,0.4); padding: 2px 6px; border-radius: 12px; font-size: 11px; font-weight: 600; }

        /* GitHub Diff Styles (Bên Phải) */
        .gh-diff-box { border: 1px solid var(--gcp-border); border-radius: 6px; overflow: hidden; background-color: var(--gcp-surface); margin-bottom: 20px;}
        .gh-diff-header { 
            background-color: #161b22; padding: 12px 16px; border-bottom: 1px solid var(--gcp-border); 
            display: flex; justify-content: space-between; align-items: center;
        }
        .gh-file-title { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 15px; font-weight: 600; color: #e6edf3; display: flex; align-items: center; gap: 8px;}
        .gh-diff-body { background-color: #0d1117; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; line-height: 1.6; }
        
        /* Từng dòng Code */
        .gh-diff-row { display: flex; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .gh-diff-row:last-child { border-bottom: none; }
        .gh-diff-marker { width: 40px; min-width: 40px; text-align: center; color: #6e7681; border-right: 1px solid #30363d; padding: 0 4px; user-select: none; opacity: 0.7;}
        .gh-diff-content { padding-left: 16px; padding-right: 16px; padding-top: 4px; padding-bottom: 4px; white-space: pre-wrap; word-break: break-word; width: 100%; }
        
        .gh-diff-row.deleted { background-color: rgba(248, 81, 73, 0.1); }
        .gh-diff-row.deleted .gh-diff-marker { background-color: rgba(248, 81, 73, 0.2); color: #ffa198; border-color: rgba(248, 81, 73, 0.4); opacity: 1;}
        .gh-diff-row.deleted .gh-diff-content { color: #ff7b72; text-decoration: line-through; opacity: 0.8; }
        
        .gh-diff-row.added { background-color: rgba(46, 160, 67, 0.15); }
        .gh-diff-row.added .gh-diff-marker { background-color: rgba(46, 160, 67, 0.3); color: #7ee787; border-color: rgba(46, 160, 67, 0.4); opacity: 1;}
        .gh-diff-row.added .gh-diff-content { color: #7ee787; }
        
        .gh-empty { padding: 40px; text-align: center; color: #8b949e; font-style: italic; border: 1px dashed #30363d; border-radius: 6px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark border-bottom" style="background-color: var(--gcp-surface); border-color: var(--gcp-border) !important; height: 60px;">
        <div class="container-fluid px-4">
            <span class="navbar-brand h1 mb-0" style="font-size: 16px;"><i class="bi bi-git me-2 text-primary"></i> Commit History (Vector Diff)</span>
            <a href="/" class="btn btn-outline-secondary border-secondary btn-sm text-light"><i class="bi bi-arrow-left me-1"></i> Quay lại Admin</a>
        </div>
    </nav>

    <div class="layout-container">
        <aside class="sidebar" id="historySidebar">
            <div class="text-center mt-5"><div class="spinner-border text-primary spinner-border-sm"></div> <span class="text-muted ms-2 small">Đang tải lịch sử...</span></div>
        </aside>

        <main class="main-content" id="diffContentArea">
            <div class="d-flex flex-column align-items-center justify-content-center h-100 text-muted">
                <i class="bi bi-file-earmark-diff" style="font-size: 4rem; opacity: 0.2;"></i>
                <p class="mt-3">Chọn một lịch sử bên trái để xem chi tiết những gì AI đã học/đã quên.</p>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        let globalHistoryData = [];

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function loadHistory() {
            $.get('/api/upload-history', function(data) {
                globalHistoryData = data;
                const sidebar = $('#historySidebar').empty();

                if (data.length === 0) {
                    sidebar.html('<div class="p-4 text-center text-muted">Chưa có lịch sử cập nhật nào.</div>');
                    return;
                }

                // Render Sidebar (Đã được sort mới nhất từ Backend đưa ra)
                data.forEach((entry, idx) => {
                    const addBadge = entry.stats.added > 0 ? `<span class="badge-add">+${entry.stats.added}</span>` : '';
                    const delBadge = entry.stats.deleted > 0 ? `<span class="badge-del">-${entry.stats.deleted}</span>` : '';
                    
                    sidebar.append(`
                        <div class="history-item" onclick="selectItem(${idx}, this)">
                            <div class="file-name"><i class="bi bi-file-text me-1 text-muted"></i> ${entry.file_name}</div>
                            <div class="meta-info">
                                <span class="text-muted"><i class="bi bi-clock"></i> ${entry.timestamp.split(' ')[0]}</span>
                                <span class="gh-badge">v${entry.version}</span>
                            </div>
                            <div class="mt-2 d-flex gap-2">
                                ${addBadge} ${delBadge}
                                ${entry.stats.added === 0 && entry.stats.deleted === 0 ? '<span class="text-muted" style="font-size: 11px;">Không đổi nội dung</span>' : ''}
                            </div>
                        </div>
                    `);
                });

                // Tự động click vào item đầu tiên (mới nhất) sau khi render xong
                $('#historySidebar .history-item').first().trigger('click');
            });
        }

        // Xử lý khi click vào 1 file bên cột trái
        function selectItem(idx, element) {
            // Thay đổi trạng thái active
            $('.history-item').removeClass('active');
            $(element).addClass('active');

            // Render dữ liệu sang cột phải
            const entry = globalHistoryData[idx];
            const mainContent = $('#diffContentArea').empty();

            let diffRowsHtml = '';
            
            // Render phần Code Bị Xóa (Màu Đỏ)
            entry.changes.deleted.forEach(chunk => {
                let lines = chunk.split('\n');
                lines.forEach(line => {
                    if(line.trim() === '') return;
                    diffRowsHtml += `
                        <div class="gh-diff-row deleted">
                            <div class="gh-diff-marker">-</div>
                            <div class="gh-diff-content">${escapeHtml(line)}</div>
                        </div>`;
                });
            });

            // Render phần Code Thêm Mới (Màu Xanh)
            entry.changes.added.forEach(chunk => {
                let lines = chunk.split('\n');
                lines.forEach(line => {
                    if(line.trim() === '') return;
                    diffRowsHtml += `
                        <div class="gh-diff-row added">
                            <div class="gh-diff-marker">+</div>
                            <div class="gh-diff-content">${escapeHtml(line)}</div>
                        </div>`;
                });
            });

            if (diffRowsHtml === '') {
                diffRowsHtml = `
                    <div class="gh-empty">
                        <i class="bi bi-check-circle text-success fs-3 d-block mb-2"></i>
                        File được tải lên đè nhưng không có sự thay đổi về mặt nội dung Text/Vector.<br>
                        AI vẫn giữ nguyên kiến thức cũ của file này.
                    </div>`;
            }

            mainContent.html(`
                <h4 class="mb-4 text-light">Chi tiết cập nhật Vector</h4>
                
                <div class="d-flex gap-4 mb-4">
                    <div><span class="text-muted small d-block">THỜI GIAN</span><strong class="text-light">${entry.timestamp}</strong></div>
                    <div><span class="text-muted small d-block">PHIÊN BẢN</span><strong class="text-primary">Version ${entry.version}</strong></div>
                    <div><span class="text-muted small d-block">TỔNG SỐ CHUNKS</span><strong class="text-light">${entry.stats.total}</strong></div>
                </div>

                <div class="gh-diff-box shadow-sm">
                    <div class="gh-diff-header">
                        <div class="gh-file-title">
                            <i class="bi bi-file-earmark-code text-muted"></i> ${entry.file_name}
                        </div>
                        <div class="d-flex gap-3 align-items-center" style="font-size: 13px;">
                            <span style="color: #7ee787;">+${entry.stats.added} mới</span>
                            <span style="color: #ff7b72;">-${entry.stats.deleted} xóa</span>
                        </div>
                    </div>
                    <div class="gh-diff-body">
                        ${diffRowsHtml}
                    </div>
                </div>
            `);
        }

        $(document).ready(loadHistory);
    </script>
</body>
</html>
